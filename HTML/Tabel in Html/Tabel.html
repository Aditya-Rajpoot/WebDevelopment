<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABEL in HTML</title>
</head>
<body>
    <table border="Black" >

        <caption>Food Menu</caption>
        <!-- Tabel header -->
        <thead>
            <tr>
        <th>Item</th>
        <th>Price</th>
             </tr>
        </thead>
    
       <!-- Tabel Body -->
        <tbody>
            <tr>
        <td>Frooti</td>
        <td>10</td>
    </tr>
    <tr>
        <td>Samosa</td>
        <td>12</td>
    </tr>
    <tr>
        <td>Coffee</td>
        <td>15</td>
    </tr>
        </tbody>
    
    </table>
</body>
</html>
