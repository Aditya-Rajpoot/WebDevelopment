<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in item</title>
</head>
<body>
    <!-- unordered liat -->
   <ul>
    <li>aman</li>
    <li>bob</li>
    <li>cat</li>
   </ul>
   <!-- ordered list -->
   <ol type = "a">
    <li>aman</li>
    <li>bob</li>
    <li>cat</li>
   </ol>
   <ol>
    <li>aman</li>
    <li>bob</li>
    <li>cat</li>
   </ol>
</body>
</html>
