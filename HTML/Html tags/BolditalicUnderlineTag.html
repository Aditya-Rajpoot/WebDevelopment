<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold Italic Underline Tag</title>
</head>
<body>
    <p>
         <b>Twinkle, twinkle, little star,</b><br> 
        <i>How I wonder what you are!</i><br>
        <u>Up above the world so high,</u><br>
            Like a diamond in the sky.
    </p>
</body>
</html>
